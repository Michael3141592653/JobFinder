[project]
name = "jobfinder"
version = "0.1.0"
description = "Personal job finder: fetch jobs from ATS providers, rank, digest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest",
    "ruff",
    "sqlfluff>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT", "ASYNC", "FAST"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
strict = true

[tool.alembic]
script_location = "%(here)s/jobfinder/db/migrations"

[tool.sqlfluff.core]
dialect = "postgres"
templater = "placeholder"
max_line_length = 100

[tool.sqlfluff.templater.placeholder]
param_style = "pyformat"  # psycopg's %(name)s

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

[tool.mypy]
plugins = ["pydantic.mypy"]  # knows BaseSettings fields come from the environment
check_untyped_defs = true  # tests have unannotated fixture arguments
